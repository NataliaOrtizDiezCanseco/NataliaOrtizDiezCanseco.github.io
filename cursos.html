<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursos y docentes · Natalia Ortiz Diez Canseco</title>
<link rel="icon" type="image/png" href="IMG_2423.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1d3a;--bur:#7a1f2b;--cream:#f6f1ea;--ink:#1d2433}
*{box-sizing:border-box}
body{margin:0;font-family:"Poppins",system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.7}
header{background:linear-gradient(120deg,#0b1d3a,#16305c,#5a1824);color:#fff;text-align:center;padding:50px 20px 44px;border-bottom:4px solid var(--bur)}
header a.back{display:inline-block;margin-bottom:16px;color:#e9dfd3;text-decoration:none;font-size:.9em}
header a.back:hover{text-decoration:underline}
h1{font-family:"Merriweather",Georgia,serif;font-size:clamp(1.6em,4.5vw,2.6em);margin:0 0 8px}
header p{margin:0;opacity:.9}
main{max-width:1000px;margin:auto;padding:30px 22px 10px}
.hint{color:#6a6f7c;font-size:.92em}
.btn{display:inline-block;padding:12px 28px;border-radius:4px;border:2px solid var(--bur);color:var(--bur);font-weight:600;text-decoration:none;transition:.3s}
.btn:hover{background:var(--bur);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:20px}
.course{background:#fff;border-radius:4px;padding:12px 16px;border-left:5px solid var(--navy);transition:.3s;box-shadow:0 3px 10px rgba(11,29,58,.07)}
.course:hover{transform:translateX(6px);border-left-color:var(--bur)}
.course small{display:block;color:#5b6783;font-size:.92em}
.course a{color:var(--bur);font-weight:600;text-decoration:none}
.course a:hover{text-decoration:underline}
footer{margin-top:60px;background:var(--navy);border-top:4px solid var(--bur);color:#fff;text-align:center;padding:26px}
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">← Volver a mi página</a>
  <h1>Cursos de la carrera y docentes</h1>
  <p>Administración de Negocios · Universidad Católica San Pablo</p>
</header>

<main>
  <p class="hint">Toca el nombre de un docente para abrir su perfil de LinkedIn.</p>
  <p><a class="btn" href="https://cloudapps.ucsp.edu.pe/site/transparencia/?page=1&amp;type=Todos&amp;search=" target="_blank" rel="noopener">Buscar docentes de la UCSP →</a></p>
  <div class="grid" id="lista"></div>
</main>

<footer>© 2026 Natalia Ortiz Diez Canseco · Arequipa, Perú</footer>

</html>
